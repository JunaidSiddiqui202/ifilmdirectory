  <!-- AUTOMATIC BLANK SCREEN RECOVERY: Nukes stale Service Workers and Caches -->
  <script>
    (function () {
      console.log('[Recovery] Checking for stale environments...');
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
            console.log('[Recovery] Unregistered SW:', regs[i].scope);
          }
        });
      }
      if (window.caches) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) {
            caches.delete(key);
            console.log('[Recovery] Cleared Cache:', key);
          });
        });
      }
      // Force hardware acceleration and prevent scrolling issues
      window.addEventListener('load', function () {
        document.body.style.opacity = '1';
      });
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
